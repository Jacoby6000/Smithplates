# Install: pre-commit install
# Run manually: pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: scala-fmt
        name: Scala format (scalafmt)
        entry: scripts/pre-commit-scala.sh fmt
        language: script
        files: \.(scala|sbt)$
        pass_filenames: false

      - id: scala-fix
        name: Scala fix (scalafix)
        entry: scripts/pre-commit-scala.sh fix
        language: script
        files: \.(scala|sbt)$
        pass_filenames: false

      - id: scala-compile
        name: Scala compile
        entry: scripts/pre-commit-scala.sh compile
        language: script
        files: \.(scala|sbt)$
        pass_filenames: false

      - id: reusable-components-sync
        name: Reusable documentation component sync
        entry: python3 scripts/sync_reusable_components.py --check
        language: system
        files: ^(docs/reusable-components/|scripts/sync_reusable_components\.py|.*\.md)$
        pass_filenames: false

      - id: codegen-template-discovery
        name: Codegen template discovery
        entry: sbtn 'smithplatesSqlServiceRenderer/testOnly *CodegenTemplateTestDiscoverySpec'
        language: system
        files: ^templates/[^/]+/tests/
        pass_filenames: false

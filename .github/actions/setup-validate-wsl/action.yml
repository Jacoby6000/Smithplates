name: Setup validate (WSL)
description: Restore caches for Windows CI validate jobs that run Nix inside WSL (run actions/checkout first).

inputs:
  cache-uv:
    description: Restore uv cache for Python language template jobs.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Restore Nix profile cache (WSL)
      uses: actions/cache@v4
      with:
        path: .ci-cache/wsl-home
        key: nix-wsl-${{ hashFiles('flake.lock') }}
        restore-keys: |
          nix-wsl-

    - name: Restore Scala dependency cache (WSL)
      uses: actions/cache@v4
      with:
        path: |
          .ci-cache/sbt
          .ci-cache/coursier
          .ci-cache/ivy2/cache
        key: sbt-wsl-${{ hashFiles('build.sbt', 'project/**') }}
        restore-keys: |
          sbt-wsl-

    - name: Restore uv cache (WSL)
      if: inputs.cache-uv == 'true'
      uses: actions/cache@v4
      with:
        path: .ci-cache/uv
        key: uv-wsl-${{ hashFiles('language-test-harnesses/python/uv.lock') }}
        restore-keys: |
          uv-wsl-

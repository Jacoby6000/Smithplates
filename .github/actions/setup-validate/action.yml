name: Setup validate
description: Install tooling and restore caches for validate jobs (run actions/checkout first).

inputs:
  backend:
    description: Validate backend (nix or docker).
    required: true
  cache-uv:
    description: Restore uv cache for Python language template jobs.
    required: false
    default: 'false'
  docker-image-cache:
    description: Restore persisted Docker test image (for Docker smoke jobs).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Nix
      if: inputs.backend == 'nix'
      uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        install_url: https://releases.nixos.org/nix/nix-2.24.9/install
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Test Nix cache mechanics (stub tests, not warm-store proof)
      if: inputs.backend == 'nix'
      shell: bash
      run: python3 scripts/test-ci-nix-cache.py

    - name: Prepare owned Nix cache staging
      if: inputs.backend == 'nix'
      id: nix-cache
      shell: bash
      run: python3 scripts/ci-nix-cache.py prepare

    - name: Restore Nix tooling archive
      if: inputs.backend == 'nix' && steps.nix-cache.outputs.enabled == 'true'
      id: nix-restore
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.nix-cache.outputs.path }}
        key: ${{ steps.nix-cache.outputs.key }}

    - name: Verify and import exact tooling archive
      if: inputs.backend == 'nix' && steps.nix-cache.outputs.enabled == 'true'
      shell: bash
      env:
        CACHE_MATCHED_KEY: ${{ steps.nix-restore.outputs.cache-matched-key }}
        CACHE_RESTORE_OUTCOME: ${{ steps.nix-restore.outcome }}
      run: python3 scripts/ci-nix-cache.py restore

    - name: Realize current Nix shell (mandatory)
      if: inputs.backend == 'nix'
      shell: bash
      run: python3 scripts/ci-nix-cache.py realize

    - name: Test existing daemon unsigned-import authority
      if: inputs.backend == 'nix' && steps.nix-cache.outputs.enabled == 'true'
      shell: bash
      run: python3 scripts/ci-nix-cache.py smoke

    - name: Inspect tooling closure; export only on main push
      if: inputs.backend == 'nix' && steps.nix-cache.outputs.enabled == 'true'
      id: nix-export
      shell: bash
      env:
        CACHE_MATCHED_KEY: ${{ steps.nix-restore.outputs.cache-matched-key }}
      run: python3 scripts/ci-nix-cache.py export

    - name: Save Nix tooling archive (attempt, check backend log)
      if: inputs.backend == 'nix' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nix-export.outputs.ready == 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.nix-cache.outputs.path }}
        key: ${{ steps.nix-cache.outputs.key }}

    - name: Remove owned Nix archive and profile before Docker export
      if: always() && inputs.backend == 'nix' && steps.nix-cache.outcome == 'success'
      shell: bash
      run: python3 scripts/ci-nix-cache.py cleanup

    - name: Restore Docker test image cache
      if: inputs.backend == 'docker' || inputs.docker-image-cache == 'true'
      uses: actions/cache@v4
      id: docker-image-cache
      with:
        path: /tmp/docker-image-cache
        key: smithystache-docker-v2-linux-amd64-${{ hashFiles('Dockerfile', '.dockerignore', 'flake.lock', 'flake.nix', 'build.sbt', 'scripts/lib/docker-image.sh', 'scripts/ci-docker-export-image.sh', 'scripts/ci-docker-load-image.sh') }}

    - name: Load Docker test image
      if: (inputs.backend == 'docker' || inputs.docker-image-cache == 'true') && steps.docker-image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: ./scripts/ci-docker-load-image.sh

    - name: Restore Scala dependency cache (Nix)
      if: inputs.backend == 'nix'
      uses: actions/cache@v4
      with:
        path: |
          /home/runner/.sbt
          /home/runner/.cache/coursier
          /home/runner/.ivy2/cache
        key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}
        restore-keys: |
          sbt-${{ runner.os }}-

    - name: Restore Scala dependency cache (Docker)
      if: inputs.backend == 'docker'
      uses: actions/cache@v4
      with:
        path: |
          .ci-cache/sbt
          .ci-cache/coursier
          .ci-cache/ivy2/cache
        key: sbt-docker-${{ hashFiles('build.sbt', 'project/**') }}
        restore-keys: |
          sbt-docker-

    - name: Restore uv cache (Nix)
      if: inputs.cache-uv == 'true' && inputs.backend == 'nix'
      uses: actions/cache@v4
      with:
        path: /home/runner/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('language-test-harnesses/python/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Restore uv cache (Docker)
      if: inputs.cache-uv == 'true' && inputs.backend == 'docker'
      uses: actions/cache@v4
      with:
        path: .ci-cache/uv
        key: uv-docker-${{ hashFiles('language-test-harnesses/python/uv.lock') }}
        restore-keys: |
          uv-docker-

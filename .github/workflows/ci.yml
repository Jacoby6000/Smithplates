name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scala:
    name: Scala build, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: sbt

      - name: Setup sbtn and sbt
        uses: coursier/setup-action@v1
        with:
          apps: sbtn sbt

      - name: Compile
        run: sbtn compile

      - name: scalafix
        run: sbtn 'scalafixAll --check'

      - name: Compile
        run: sbtn compile

      - name: Unit tests (IR and renderers)
        run: |
          sbtn smithySqlIr/test
          sbtn smithySqlServiceIr/test
          sbtn smithySqlPostgresRenderer/test
          sbtn smithySqlSqliteRenderer/test
          sbtn smithySqlServiceRenderer/test

      - name: Unit tests (plugin)
        run: sbtn smithyStachePlugin/test

      - name: Integration tests (Postgres)
        run: sbtn smithySqlPostgresRendererIt/test

      - name: Integration tests (SQLite)
        run: sbtn smithySqlSqliteRendererIt/test

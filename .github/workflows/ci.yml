name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  validate-plugin-build:
    name: Plugin build (Nix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-validate
        with:
          backend: nix

      - name: Validate
        run: ./validate --target plugin

  validate-language-templates:
    name: Language templates (${{ matrix.language }}, Nix)
    needs: validate-plugin-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with language-test-harnesses/<language>/ directories.
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-validate
        with:
          backend: nix
          cache-uv: true

      - name: Validate
        run: ./validate --target ${{ matrix.language }}

  validate-example-tests:
    name: Example HTTP tests (${{ matrix.client }} client -> ${{ matrix.server }} server)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with example/tests/targets/<language>/ directories.
        include:
          - client: python
            server: python
          - client: openapi-reference-python
            server: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup
        uses: ./.github/actions/setup-validate
        with:
          backend: nix
          cache-uv: true

      - name: Render example smithy-build configs
        run: nix develop --accept-flake-config --command ./scripts/render-smithy-build.sh all

      - name: Run shared HTTP reference tests
        run: nix develop --accept-flake-config --command ./example/tests/run-tests.sh ${{ matrix.client }} ${{ matrix.server }}

      - name: Commit rendered example smithy-build configs
        id: commit-smithy-build
        if: >-
          success() &&
          matrix.client == 'python' &&
          matrix.server == 'python' &&
          (
            github.event_name == 'push' ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update example smithy-build configs from CI render
          file_pattern: example/python/smithy-build.json example/openapi-reference-python/smithy-build.json

      - name: Comment on pull request
        if: >-
          github.event_name == 'pull_request' &&
          steps.commit-smithy-build.outputs.changes_detected == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const commitHash = '${{ steps.commit-smithy-build.outputs.commit_hash }}';
            const shaShort = commitHash.slice(0, 7);
            const commitUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitHash}`;
            const body = [
              'CI re-rendered example `smithy-build.json` configs and pushed an update after example tests passed.',
              '',
              '- `example/python/smithy-build.json`',
              '- `example/openapi-reference-python/smithy-build.json`',
              '',
              `Commit: [\`${shaShort}\`](${commitUrl})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  validate-docker:
    name: Validate (Docker smoke)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Host Nix is required to fingerprint `nix develop` for parity with the
      # container; docker-image-cache restores the test image separately.
      - name: Setup
        uses: ./.github/actions/setup-validate
        with:
          backend: nix
          docker-image-cache: true

      - name: Smoke test
        run: ./scripts/ci-docker-validate.sh

      - name: Free host Nix store before Docker cache export
        run: nix-collect-garbage -d

      - name: Finalize
        uses: ./.github/actions/finalize-docker-validate

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  validate-plugin-build:
    name: Plugin build (Nix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-validate
        with:
          backend: nix

      - name: Validate
        run: ./validate --target plugin

  validate-language-templates:
    name: Language templates (${{ matrix.language }}, Nix)
    needs: validate-plugin-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with language-test-harnesses/<language>/ directories.
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-validate
        with:
          backend: nix
          cache-uv: true

      - name: Validate
        run: ./validate --target ${{ matrix.language }}

  validate-docker:
    name: Validate (Docker smoke)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Host Nix is required to fingerprint `nix develop` for parity with the
      # container; docker-image-cache restores the test image separately.
      - name: Setup
        uses: ./.github/actions/setup-validate
        with:
          backend: nix
          docker-image-cache: true

      - name: Smoke test
        run: ./scripts/ci-docker-validate.sh

      - name: Finalize
        uses: ./.github/actions/finalize-docker-validate

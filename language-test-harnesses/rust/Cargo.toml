[package]
name = "smithplates-rust-client-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

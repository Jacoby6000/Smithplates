[project]
name = "smithplates-python-language-test-harness"
version = "0.1.0"
description = "Execute generated Python integration tests from templates/python/tests golden expected/ trees"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--capture=tee-sys",
    "--tb=short",
]
markers = [
    "integration: derived SQL integration tests",
    "sqlite: sqlite / aiosqlite backend",
    "postgres: postgres / psycopg backend",
]

[tool.mypy]
python_version = "3.12"
strict = true
extra_checks = true
local_partial_types = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# DESNOTE(jbarber, 2026-06-19): UP017 flags datetime.UTC alias; generated and harness code uses
# timezone.utc for broader Python version compatibility in golden fixtures.
ignore = ["UP017"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

# DESNOTE(jbarber, 2026-06-19): Per-file ignores target generated/template Python where line length,
# PEP 695 type params (UP047), or ternary style (SIM108) are constrained by codegen output shape.
[tool.ruff.lint.per-file-ignores]
"**/sqlite_transaction_run.py" = ["UP047"]
"**/psycopg_transaction_run.py" = ["UP047"]
"**/test_*_derived_sql.py" = ["E501"]
"**/*_aiosqlite.py" = ["E501"]
"**/*_psycopg.py" = ["E501"]

[project]
name = "petstore-example"
version = "0.1.0"
description = "Smithplates petstore reference implementation (Python)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "aiohttp-retry>=2.9",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dateutil>=2.9",
    "uvicorn[standard]>=0.32",
    "urllib3>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.9",
]

[project.scripts]
petstore-server = "server.app:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "src/generated/client",
    "src/generated/db/model",
    "src/generated/db",
    "src/generated/db/sqlite",
    "src/generated/db/postgres",
    "src/generated",
    "src",
]
addopts = ["-v", "--tb=short"]
markers = [
    "integration: derived SQL integration tests",
    "sqlite: sqlite / aiosqlite backend",
    "postgres: postgres / psycopg backend",
]

[tool.mypy]
python_version = "3.12"
strict = true
extra_checks = true
local_partial_types = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = [
    "tests/db/postgres/stubs",
    "src/generated/generated",
    "src/generated/client",
    "src/generated/db/model",
    "src/generated/db",
    "src/generated/db/sqlite",
    "src/generated/db/postgres",
    "src/generated",
    "src",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP017"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"**/sqlite_transaction_run.py" = ["UP047"]
"**/psycopg_transaction_run.py" = ["UP047"]
"**/test_*_derived_sql.py" = ["E501"]
"**/*_aiosqlite.py" = ["E501", "SIM108"]
"**/*_psycopg.py" = ["E501", "SIM108"]
"src/generated/**" = ["E501", "F821"]

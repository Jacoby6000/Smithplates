[project]
name = "petstore-example"
version = "0.1.0"
description = "Smithplates petstore reference implementation (Python)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "aiohttp-retry>=2.9",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dateutil>=2.9",
    "uvicorn[standard]>=0.32",
    "urllib3>=2.0",
]

[project.scripts]
petstore-server = "server.app:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "src/generated/client",
    "src/generated/db/model",
    "src/generated/db",
    "src/generated/db/sqlite",
    "src/generated",
    "src",
]
addopts = ["-v", "--tb=short"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"**/sqlite_transaction_run.py" = ["UP047"]
"**/psycopg_transaction_run.py" = ["UP047"]
"**/test_*_derived_sql.py" = ["E501"]
"**/*_aiosqlite.py" = ["E501"]
"**/*_psycopg.py" = ["E501"]
"src/generated/**" = ["E501", "F821"]
